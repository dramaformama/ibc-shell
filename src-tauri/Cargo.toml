[package]
name = "ibc-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "ibc-shell"

[lib]
name = "ibc_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
secrecy.workspace = true
thiserror.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
ibc-shell-store.workspace = true
ibc-shell-vault.workspace = true
ibc-shell-ssh.workspace = true
ibc-shell-sftp.workspace = true
zeroize.workspace = true
# Prompt timeouts + oneshot/mpsc in the session pump (rt is provided by Tauri).
tokio = { workspace = true, features = ["time", "sync", "macros"] }
tauri-plugin-dialog = "2"

[lints]
workspace = true
