[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# "Unmaintained" notices fail CI only for our direct dependencies; for transitive ones there is no
# replacement we could switch to, so they are reported but not blocking. Vulnerabilities always fail.
unmaintained = "workspace"
ignore = [
  # rsa Marvin timing attack: no upstream fix. We only sign locally with the user's own RSA key
  # (no remote party can time a decryption oracle). Revisit when russh moves to a fixed rsa.
  { id = "RUSTSEC-2023-0071", reason = "client-side signing only, no decryption oracle exposed" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
