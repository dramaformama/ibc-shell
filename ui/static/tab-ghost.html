<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title></title>
    <style>
      :root {
        --surface: #ffffff;
        --text: #1d1d1f;
        --border: rgb(0 0 0 / 0.12);
        color-scheme: light;
      }
      :root.dark {
        --surface: #2a2a2d;
        --text: #f5f5f7;
        --border: rgb(255 255 255 / 0.14);
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--surface);
        cursor: default;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 12px;
        border: 0.5px solid var(--border);
        color: var(--text);
        font:
          500 13px/1 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          system-ui,
          sans-serif;
      }
      img {
        flex: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
      }
      span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
    <script src="/tab-ghost.js" defer></script>
  </head>
  <body></body>
</html>
