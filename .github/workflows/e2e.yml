name: e2e
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Run e2e
        run: just e2e
      - name: Server logs on failure
        if: failure()
        run: docker compose -f tests/docker/compose.yml logs --tail=200
