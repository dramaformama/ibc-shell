# Release builds: a tag `vX.Y.Z` builds macOS (Apple Silicon + Intel), Windows and Linux installers
# and publishes them as a GitHub Release (stable file names, so README download links never change). Nothing is signed with a paid certificate:
# macOS bundles are ad-hoc signed (bundle.macOS.signingIdentity "-"), Windows is unsigned.
# Third-party actions are pinned by commit SHA, as in ci.yml; the release itself uses the gh CLI.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15, target: aarch64-apple-darwin, bundles: dmg }
          - { name: macos-x64, os: macos-15-intel, target: x86_64-apple-darwin, bundles: dmg }
          - { name: windows-x64, os: windows-2022, target: x86_64-pc-windows-msvc, bundles: nsis }
          - { name: linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, bundles: "appimage,deb" }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux system deps (Tauri / WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev

      - name: Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$app" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != tauri.conf.json version v$app" >&2
            exit 1
          fi

      - name: Build installers
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          bundle="target/${{ matrix.target }}/release/bundle"
          # Stable names: the README links to releases/latest/download/<name>.
          case "${{ matrix.name }}" in
            macos-arm64) pick() { find "$bundle" -name '*.dmg' -exec cp {} dist/iBC-Shell-macOS-Apple-Silicon.dmg \; ; } ;;
            macos-x64) pick() { find "$bundle" -name '*.dmg' -exec cp {} dist/iBC-Shell-macOS-Intel.dmg \; ; } ;;
            windows-x64) pick() { find "$bundle" -name '*-setup.exe' -exec cp {} dist/iBC-Shell-Windows-x64-setup.exe \; ; } ;;
            linux-x64) pick() {
              find "$bundle" -name '*.AppImage' -exec cp {} dist/iBC-Shell-Linux-x64.AppImage \; ;
              find "$bundle" -name '*.deb' -exec cp {} dist/iBC-Shell-Linux-x64.deb \; ; } ;;
          esac
          pick
          ls -l dist

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ibc-shell-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --latest --title "iBC Shell ${GITHUB_REF_NAME#v}" \
            --notes "Установщики для macOS (Apple Silicon и Intel), Windows и Linux. Сборки без платной подписи: см. раздел «Скачать» в README."
